name: Deploy to EC2 and Restart Service

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Deploy to EC2 and Restart Service
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@${{ secrets.EC2_HOST }} bash -euo pipefail -s << 'EOF'
          export PATH="/home/ubuntu/.nvm/versions/node/v24.18.0/bin:$PATH"

          cd CodeBrim
          git pull origin master

          # Everything up to the restart runs while the old app keeps serving,
          # so downtime is only the app's startup time.
          cd Backend
          npm install --no-audit --no-fund
          npx prisma generate

          bash db/start-postgres.sh
          npx prisma migrate deploy

          sudo systemctl reset-failed myapp.service
          sudo systemctl restart myapp.service

          echo "Waiting for the app to answer on :5000 ..."
          for i in $(seq 1 24); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://localhost:5000/ || true)
            if [ "$code" != "000" ]; then
              echo "Healthy after $((i * 5))s (HTTP $code)"
              exit 0
            fi
            sleep 5
          done

          echo "App did not respond within 120s. Recent logs:"
          sudo journalctl -u myapp.service -n 50 --no-pager
          exit 1
          EOF
