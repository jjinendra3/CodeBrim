name: Deploy Backend and Restart Service

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Set up SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Trust the deploy host
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy and restart
        run: |
          ssh -T ubuntu@${{ secrets.EC2_HOST }} bash -euo pipefail -s << 'EOF'
          export PATH="/home/ubuntu/.nvm/versions/node/v24.18.0/bin:$PATH"

          cd /home/ubuntu/CodeBrim
          git pull --ff-only origin master
          echo "Deployed commit: $(git rev-parse --short HEAD)"

          cd Backend
          npm ci
          npx prisma generate

          sudo systemctl restart myapp.service
          sudo systemctl is-active --quiet myapp.service

          echo "Waiting for the app to answer on :5000 ..."
          for i in $(seq 1 24); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://localhost:5000/ || true)
            if [ "$code" != "000" ]; then
              echo "Healthy after $((i * 5))s (HTTP $code)"
              exit 0
            fi
            sleep 5
          done

          echo "App did not respond within 120s. Recent logs:"
          sudo journalctl -u myapp.service -n 50 --no-pager
          exit 1
          EOF
