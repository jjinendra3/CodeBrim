# Local development services: Postgres and Redis.
#   docker compose up -d
# Production servers use Backend/db/start-postgres.sh instead (see README).
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: codebrim
      POSTGRES_PASSWORD: codebrim
      POSTGRES_DB: codebrim
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - codebrim-pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped

volumes:
  codebrim-pgdata:
